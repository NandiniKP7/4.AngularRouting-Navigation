<header class="app-header">
  <div class="header-content">
    <div class="brand">
      <div class="brand-icon">✓</div>

      <div>
        <h1>MyTaskHub</h1>
        <p>Keep work, learning, home, and family organized.</p>
      </div>
    </div>

    <nav class="main-nav">
      <a [routerLink]="Home_Route" routerLinkActive="active-link" ariaCurrentWhenActive="page"
        >Home</a
      >
      <a [routerLink]="Office_Route" routerLinkActive="active-link" ariaCurrentWhenActive="page"
        >Office</a
      >
      <a [routerLink]="Learning_Route" routerLinkActive="active-link" ariaCurrentWhenActive="page"
        >Learning</a
      >
      <a
        [routerLink]="HouseActivities_Route"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        >Home Activities</a
      >
      <a [routerLink]="kid_Route" routerLinkActive="active-link" ariaCurrentWhenActive="page"
        >Kid</a
      >
    </nav>
  </div>
</header>

<main class="page-container">
  <!-- Angular places the matched route component here -->
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <p>MyTaskHub — One place for everything that matters.</p>
</footer>
